<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Requisition Slip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f3f4f6;
        }

        /* --- STYLES FOR THE PRINTABLE RECEIPT --- */
        #receipt-preview { display: none; }

        @media print {
            body > *:not(.print-container) { display: none !important; }
            .print-container { display: block !important; position: absolute; top: 0; left: 0; }
            @page { margin: 0.5cm; }
            .receipt-content { font-family: 'Courier New', Courier, monospace; font-size: 10pt; line-height: 1.3; color: #000; background-color: #fff; width: 72mm; }
            .receipt-content header { text-align: center; margin-bottom: 8px; }
            .receipt-content h1 { font-size: 12pt; margin: 0; padding: 0; font-weight: bold; text-transform: uppercase; }
            .receipt-content h2 { font-size: 10pt; margin: 0; padding: 2px 0; font-weight: normal; border-top: 1px dashed #000; border-bottom: 1px dashed #000; margin-top: 4px; text-transform: uppercase; }
            .receipt-content .info-section { margin-top: 8px; margin-bottom: 8px; font-size: 9pt; }
            .receipt-content .info-section div { display: flex; justify-content: space-between; }
            .receipt-content .info-section .label { font-weight: bold; margin-right: 5px; }
            .receipt-content .items-table { width: 100%; padding-top: 8px; margin-top: 8px; }
            .receipt-content .items-header .row { display: flex; font-weight: bold; border-bottom: 1px dashed #000; padding-bottom: 4px; margin-bottom: 4px; }
            .receipt-content .items-body .item { display: flex; margin-bottom: 4px; }
            .receipt-content .col-qty { width: 15%; text-align: left; }
            .receipt-content .col-item { width: 85%; word-break: break-all; }
            .receipt-content footer { padding-top: 8px; margin-top: 15px; text-align: center; }
            .qrcode-container { margin: 10px auto; display: flex; justify-content: center; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="entry-form" class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <div class="text-center mb-6">
            <img src="logoAGCtransparentback.png" alt="Company Logo" class="mx-auto w-48 mb-2">
            <h1 class="text-2xl font-bold text-gray-800">Stock Requisition Slip</h1>
            <p class="text-gray-500 text-sm">List items taken from stock.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label for="boatName" class="block text-sm font-medium text-gray-700">Boat Name / Client</label>
                <input type="text" id="boatName" placeholder="e.g., INDIABOO" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 text-sm">
            </div>
            
            <div class="border-t pt-4">
                <h2 class="text-lg font-semibold text-gray-700">Items</h2>
                <div id="items-list" class="mt-2 space-y-2">
                    </div>
                <button type="button" id="add-item-btn" class="mt-3 text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded">
                    + Add Item
                </button>
            </div>
        </div>

        <div class="mt-8 border-t pt-6">
            <button type="button" id="print-btn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-lg text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700">
                Generate & Print Slip
            </button>
        </div>
    </div>

    <div id="receipt-preview" class="print-container"></div>

    <div id="scanner-modal" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg flex flex-col">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="text-lg font-medium">Scan Barcode</h3>
                <button type="button" id="scanner-close-button" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            </div>
            <div class="p-4">
                <div id="scanner-container" class="w-full h-auto border bg-black rounded"></div>
                <div id="scanner-error" class="text-red-500 text-sm mt-2 hidden"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const boatNameInput = document.getElementById('boatName');
            const itemsList = document.getElementById('items-list');
            const addItemBtn = document.getElementById('add-item-btn');
            const printBtn = document.getElementById('print-btn');
            const receiptPreview = document.getElementById('receipt-preview');

            // --- Scanner Setup ---
            const scannerModal = document.getElementById('scanner-modal');
            const scannerError = document.getElementById('scanner-error');
            const html5QrCode = new Html5Qrcode("scanner-container");
            let currentScanTargetInput = null;

            const qrCodeSuccessCallback = (decodedText, decodedResult) => {
                if (currentScanTargetInput) {
                    currentScanTargetInput.value = decodedText;
                }
                stopScanner();
            };
            
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            function startScanner(targetInput) {
                currentScanTargetInput = targetInput;
                scannerModal.classList.remove('hidden');
                scannerError.classList.add('hidden');
                html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback)
                    .catch(err => {
                        scannerError.textContent = "Unable to start camera. Please grant permission.";
                        scannerError.classList.remove('hidden');
                    });
            }

            function stopScanner() {
                html5QrCode.stop().catch(err => {}).finally(() => {
                    scannerModal.classList.add('hidden');
                });
            }
            
            document.getElementById('scanner-close-button').addEventListener('click', stopScanner);


            // --- Form Functions ---
            function createItemRow() {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 item-row';
                row.innerHTML = `
                    <input type="number" placeholder="Qty" class="item-qty w-1/6 block px-3 py-2 border border-gray-300 rounded-md text-sm" min="1" value="1">
                    <div class="flex-grow flex items-center border border-gray-300 rounded-md">
                        <input type="text" placeholder="Part Number or Description" class="item-desc w-full px-3 py-2 border-0 rounded-md text-sm focus:ring-0">
                        <button type="button" class="scan-item-btn p-2 text-gray-500 hover:text-blue-600" title="Scan Barcode">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2H4zm10.5 9.5a1 1 0 10-2 0v-1a1 1 0 102 0v1zM4 11.5a1 1 0 112 0v-1a1 1 0 11-2 0v1zm1.5-6.5a1 1 0 10-2 0v2a1 1 0 102 0V5zM5.5 15a1 1 0 11-2 0v-2a1 1 0 112 0v2zm9-9.5a1 1 0 10-2 0v2a1 1 0 102 0V5zM14.5 15a1 1 0 11-2 0v-2a1 1 0 112 0v2zM7 7a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1zm6 0a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                        </button>
                    </div>
                    <button type="button" class="remove-item-btn text-sm bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-3 rounded">Remove</button>
                `;
                itemsList.appendChild(row);

                row.querySelector('.remove-item-btn').addEventListener('click', () => row.remove());
            }

            // Use event delegation for scan buttons
            itemsList.addEventListener('click', (e) => {
                const scanBtn = e.target.closest('.scan-item-btn');
                if (scanBtn) {
                    const parentRow = scanBtn.closest('.item-row');
                    const targetInput = parentRow.querySelector('.item-desc');
                    startScanner(targetInput);
                }
            });

            createItemRow();
            addItemBtn.addEventListener('click', createItemRow);
            
            // --- Print Function ---
            printBtn.addEventListener('click', () => {
                const boatName = boatNameInput.value.trim();
                if (!boatName) {
                    alert('Please enter a Boat Name.');
                    boatNameInput.focus();
                    return;
                }

                const items = [];
                itemsList.querySelectorAll('.item-row').forEach(row => {
                    const qty = row.querySelector('.item-qty').value;
                    const desc = row.querySelector('.item-desc').value.trim();
                    if (desc) items.push({ qty: qty || '1', desc: desc });
                });
                
                if (items.length === 0) {
                    alert('Please add at least one item with a description.');
                    return;
                }

                const dateObj = new Date();
                const dateString = dateObj.toLocaleDateString('en-PH', { year: 'numeric', month: '2-digit', day: '2-digit' });

                let itemsHtml = '';
                items.forEach(item => {
                    itemsHtml += `<div class="item"><div class="col-qty">${item.qty}x</div><div class="col-item">${item.desc}</div></div>`;
                });

                receiptPreview.innerHTML = `
                    <div class="receipt-content">
                        <header><h1>AGC MARINE SOLUTIONS</h1><h2>Stock Requisition</h2></header>
                        <section class="info-section">
                            <div><span class="label">For:</span><span>${boatName}</span></div>
                            <div><span class="label">Date:</span><span>${dateString}</span></div>
                        </section>
                        <section class="items-table">
                            <div class="items-header"><div class="row"><div class="col-qty">QTY</div><div class="col-item">ITEM</div></div></div>
                            <div class="items-body">${itemsHtml}</div>
                        </section>
                        <footer><div id="qrcode-container" class="qrcode-container"></div></footer>
                    </div>`;
                
                const qrData = {
                    slipType: "Stock Requisition", boatName: boatName,
                    date: dateObj.toISOString(), items: items
                };

                new QRCode(document.getElementById("qrcode-container"), {
                    text: JSON.stringify(qrData), width: 80, height: 80,
                    colorDark : "#000000", colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.M
                });
                
                setTimeout(() => window.print(), 250);
            });
        });
    </script>

</body>
</html>
