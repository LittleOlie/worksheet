<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Requisition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f3f4f6; }
        #receipt-preview { display: none; }
        @media print {
            body > *:not(.print-container) { display: none !important; }
            .print-container { display: block !important; position: absolute; top: 0; left: 0; }
            @page { margin: 0.5cm; }
            .receipt-content { font-family: 'Courier New', Courier, monospace; font-size: 9pt; line-height: 1.3; color: #000; background-color: #fff; width: 72mm; }
            .receipt-content header { text-align: center; margin-bottom: 8px; }
            .receipt-content h1 { font-size: 11pt; margin: 0; padding: 0; font-weight: bold; text-transform: uppercase; }
            .receipt-content h2 { font-size: 10pt; margin: 0; padding: 2px 0; font-weight: normal; border-top: 1px dashed #000; border-bottom: 1px dashed #000; margin-top: 4px; text-transform: uppercase; }
            .receipt-content .info-section { margin-top: 8px; margin-bottom: 8px; font-size: 9pt; }
            /* --- MODIFIED: Removed 'justify-content: space-between;' --- */
            .receipt-content .info-section div { display: flex; }
            .receipt-content .info-section .label { font-weight: bold; margin-right: 5px; }
            .receipt-content .items-table { width: 100%; padding-top: 8px; margin-top: 8px; }
            .receipt-content .items-header .row { display: flex; font-weight: bold; border-bottom: 1px dashed #000; padding-bottom: 4px; margin-bottom: 4px; }
            .receipt-content .items-body .item-row { margin-bottom: 8px; }
            .receipt-content .items-body .main-row { display: flex; }
            .receipt-content .items-body .sub-row { padding-left: 4ch; font-style: italic; color: #333; font-size: 8pt; }
            .receipt-content .items-body .barcode-image { display: block; margin-left: 4ch; margin-top: 2px; width: 85%; height: 35px; }
            .receipt-content .col-qty { width: 4ch; text-align: left; }
            .receipt-content .col-part { flex-grow: 1; word-break: break-all; }
            .receipt-content footer { padding-top: 8px; margin-top: 15px; text-align: center; }
            .qrcode-container { margin: 10px auto; display: flex; justify-content: center; }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div id="entry-form" class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Stock Requisition (Step 1: Taking Items)</h1>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="boatName" class="block text-sm font-medium text-gray-700">Boat Name / Client</label>
                <input type="text" id="boatName" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm text-sm">
            </div>
            <div>
                <label for="personName" class="block text-sm font-medium text-gray-700">Person Taking Items</label>
                <input type="text" id="personName" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm text-sm">
            </div>
        </div>
        <div class="border-t pt-4 mt-4">
            <h2 class="text-lg font-semibold text-gray-700">Items</h2>
            <div id="items-list" class="mt-2 space-y-3"></div>
            <button type="button" id="add-item-btn" class="mt-3 text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded">+ Add Item</button>
        </div>
        <div class="mt-8 border-t pt-6">
            <button type="button" id="print-btn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-lg text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700">Generate & Print Requisition Slip</button>
        </div>
    </div>

    <datalist id="parts-datalist"></datalist>

    <div id="receipt-preview" class="print-container"></div>
    <div id="scanner-modal" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg flex flex-col">
            <div class="p-4 border-b flex justify-between items-center"><h3 class="text-lg font-medium">Scan Part Number</h3><button type="button" id="scanner-close-button" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button></div>
            <div class="p-4"><div id="scanner-container" class="w-full h-auto border bg-black rounded"></div><div id="scanner-error" class="text-red-500 text-sm mt-2 hidden"></div></div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const boatNameInput = document.getElementById('boatName');
        const personNameInput = document.getElementById('personName');
        const itemsList = document.getElementById('items-list');
        const addItemBtn = document.getElementById('add-item-btn');
        const printBtn = document.getElementById('print-btn');
        const receiptPreview = document.getElementById('receipt-preview');
        const partsDatalist = document.getElementById('parts-datalist');

        const scannerModal = document.getElementById('scanner-modal');
        const scannerError = document.getElementById('scanner-error');
        const html5QrCode = new Html5Qrcode("scanner-container");
        let currentScanTargetInput = null;

        let partsData = [];
        async function loadPartsData() {
            try {
                const response = await fetch('parts.json');
                if (!response.ok) throw new Error('Network response was not ok');
                let rawData = await response.json();
                
                partsData = rawData.slice(1);
                
                partsData.forEach(part => {
                    if (part.B) {
                        const option = document.createElement('option');
                        option.value = part.B;
                        option.textContent = part.C;
                        partsDatalist.appendChild(option);
                    }
                    if (part.I && part.I !== part.B) {
                        const option = document.createElement('option');
                        option.value = part.I;
                        option.textContent = part.C;
                        partsDatalist.appendChild(option);
                    }
                });

            } catch (error) {
                console.error('Could not load parts data:', error);
                alert('Warning: Could not load the parts master list. Autocomplete will not be available.');
            }
        }
        loadPartsData();

        const qrCodeSuccessCallback = (decodedText) => { if (currentScanTargetInput) { currentScanTargetInput.value = decodedText; } stopScanner(); };
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        function startScanner(targetInput) { currentScanTargetInput = targetInput; scannerModal.classList.remove('hidden'); scannerError.classList.add('hidden'); html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback).catch(err => { scannerError.textContent = "Unable to start camera."; scannerError.classList.remove('hidden'); }); }
        function stopScanner() { html5QrCode.stop().catch(err => {}).finally(() => { scannerModal.classList.add('hidden'); }); }
        document.getElementById('scanner-close-button').addEventListener('click', stopScanner);

        function createItemRow() {
            const row = document.createElement('div');
            row.className = 'p-3 border rounded-md bg-gray-50 space-y-2 item-row';
            row.innerHTML = `
                <div class="flex items-center gap-2">
                    <input type="number" placeholder="Qty" class="item-qty w-20 px-3 py-2 border border-gray-300 rounded-md text-sm" min="1" value="1">
                    <div class="flex-grow flex items-center border border-gray-300 rounded-md bg-white">
                        <input type="text" placeholder="Part Number or Barcode" class="item-part-no w-full px-3 py-2 border-0 rounded-md text-sm focus:ring-0" list="parts-datalist">
                        <button type="button" class="scan-item-btn p-2 text-gray-500 hover:text-blue-600" title="Scan Part Number">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 5a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2H4zm10 5a3 3 0 11-6 0 3 3 0 016 0z" clip-rule="evenodd" /></svg>
                        </button>
                    </div>
                    <button type="button" class="remove-item-btn text-sm bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-3 rounded">Remove</button>
                </div>
                <div>
                    <input type="text" placeholder="Description (optional)" class="item-desc w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                </div>`;
            itemsList.appendChild(row);
            row.querySelector('.remove-item-btn').addEventListener('click', () => row.remove());

            const partNoInput = row.querySelector('.item-part-no');
            const descInput = row.querySelector('.item-desc');
            
            partNoInput.addEventListener('change', () => {
                const inputValue = partNoInput.value.toLowerCase().trim();
                if (!inputValue) return;

                const selectedPart = partsData.find(p =>
                    (p.B && p.B.toLowerCase() === inputValue) ||
                    (p.I && p.I.toLowerCase() === inputValue)
                );
                
                if (selectedPart) {
                    descInput.value = selectedPart.C;
                    if (partNoInput.value !== selectedPart.B) {
                        partNoInput.value = selectedPart.B;
                    }
                }
            });
        }

        itemsList.addEventListener('click', (e) => {
            const scanBtn = e.target.closest('.scan-item-btn');
            if (scanBtn) {
                const targetInput = scanBtn.closest('.item-row').querySelector('.item-part-no');
                startScanner(targetInput);
            }
        });

        createItemRow();
        addItemBtn.addEventListener('click', createItemRow);
        
        printBtn.addEventListener('click', () => {
            const boatName = boatNameInput.value.trim();
            const personName = personNameInput.value.trim();
            if (!boatName || !personName) { alert('Please enter both Boat Name and Person Name.'); return; }

            const items = [];
            itemsList.querySelectorAll('.item-row').forEach(row => {
                const partNo = row.querySelector('.item-part-no').value.trim();
                const desc = row.querySelector('.item-desc').value.trim();
                const qty = row.querySelector('.item-qty').value;

                const partObject = partsData.find(p => p.B && p.B.toLowerCase() === partNo.toLowerCase());
                const barcode = partObject ? (partObject.I || '') : '';

                if (partNo || desc) { 
                    items.push({ partNo, desc, qty: qty || '1', barcode: barcode });
                }
            });
            if (items.length === 0) { alert('Please add at least one item.'); return; }

            const dateObj = new Date();
            const dateString = dateObj.toLocaleDateString('en-PH', { year: 'numeric', month: '2-digit', day: '2-digit' });
            
            let itemsHtml = '';
            items.forEach((item, index) => {
                itemsHtml += `<div class="item-row">`;
                itemsHtml += `<div class="main-row"><div class="col-qty">${item.qty}x</div><div class="col-part">${item.partNo}</div></div>`;
                if (item.barcode) {
                    itemsHtml += `<svg class="barcode-image" id="barcode-${index}"></svg>`;
                }
                if (item.desc) { 
                    itemsHtml += `<div class="sub-row">${item.desc}</div>`;
                }
                itemsHtml += `</div>`;
            });

            const requisitionData = { slipType: "Requisition", boatName, personName, date: dateObj.toISOString(), items };
            const encodedData = btoa(JSON.stringify(requisitionData));
            const returnUrl = new URL('returns.html', window.location.href);
            returnUrl.searchParams.set('data', encodedData);

            receiptPreview.innerHTML = `
                <div class="receipt-content">
                    <header><h1>AGC MARINE SOLUTIONS</h1><h2>Stock Requisition Slip</h2></header>
                    <section class="info-section">
                        <div><span class="label">For:</span><span>${boatName}</span></div>
                        <div><span class="label">By:</span><span>${personName}</span></div>
                        <div><span class="label">Date:</span><span>${dateString}</span></div>
                    </section>
                    <section class="items-table">
                        <div class="items-header"><div class="row"><div class="col-qty">QTY</div><div class="col-part">PART NO. / DESCRIPTION</div></div></div>
                        <div class="items-body">${itemsHtml}</div>
                    </section>
                    <footer><p style="font-size:8pt; margin-bottom: 5px;">Scan QR to process returns</p><div id="qrcode-container" class="qrcode-container"></div></footer>
                </div>`;
            
            items.forEach((item, index) => {
                if (item.barcode) {
                    try {
                        JsBarcode(`#barcode-${index}`, item.barcode, {
                            format: "CODE128",
                            height: 30,
                            displayValue: true,
                            fontSize: 10,
                            margin: 0
                        });
                    } catch (e) {
                        console.error("Failed to generate barcode for:", item.barcode, e);
                        const el = document.getElementById(`barcode-${index}`);
                        if(el) el.outerHTML = `<div class="sub-row" style="color:red;">Invalid Barcode</div>`;
                    }
                }
            });
            
            new QRCode(document.getElementById("qrcode-container"), { 
                text: returnUrl.href, 
                width: 120, 
                height: 120, 
                correctLevel : QRCode.CorrectLevel.L 
            });

            setTimeout(() => window.print(), 250);
        });
    });
    </script>
</body>
</html>
