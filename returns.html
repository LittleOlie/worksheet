<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Returns</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f3f4f6; }
        #receipt-preview { display: none; }
        .info-box { background-color: #eef2ff; border-left: 4px solid #4f46e5; padding: 0.75rem; }
        @media print {
            body > *:not(.print-container) { display: none !important; }
            .print-container { display: block !important; position: absolute; top: 0; left: 0; }
            @page { margin: 0.5cm; }
            .receipt-content { font-family: 'Courier New', Courier, monospace; font-size: 9pt; line-height: 1.3; color: #000; background-color: #fff; width: 72mm; }
            .receipt-content header { text-align: center; margin-bottom: 8px; }
            .receipt-content h1 { font-size: 11pt; margin: 0; padding: 0; font-weight: bold; text-transform: uppercase; }
            .receipt-content h2 { font-size: 10pt; margin: 0; padding: 2px 0; font-weight: normal; border-top: 1px dashed #000; border-bottom: 1px dashed #000; margin-top: 4px; text-transform: uppercase; }
            .receipt-content .info-section { margin-top: 8px; margin-bottom: 8px; }
            .receipt-content .items-table { width: 100%; padding-top: 5px; margin-top: 5px; }
            .receipt-content .items-header .row { display: flex; font-weight: bold; border-bottom: 1px dashed #000; padding-bottom: 4px; margin-bottom: 4px; text-align: center;}
            .receipt-content .items-body .item-row { display: flex; text-align: center; }
            .receipt-content .col-part { width: 45%; text-align: left; word-break: break-all; padding-right:5px;}
            .receipt-content .col-qty { width: 18%; }
            .receipt-content footer { margin-top: 15px; text-align: center; }
            .qrcode-container { margin: 10px auto; display: flex; justify-content: center; }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div id="return-form" class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <div class="text-center mb-4">
            <h1 class="text-2xl font-bold text-gray-800">Stock Reconciliation (Step 2: Processing Returns)</h1>
        </div>
        <div id="original-data" class="space-y-4">
            <div class="info-box text-sm">
                <p><strong>Boat/Client:</strong> <span id="boatName-display"></span></p>
                <p><strong>Original Slip By:</strong> <span id="personName-display"></span></p>
                <p><strong>Date Taken:</strong> <span id="date-display"></span></p>
            </div>
            <div class="border-t pt-4">
                <h2 class="text-lg font-semibold text-gray-700">Enter Returned Quantities</h2>
                <div class="mt-2 space-y-3" id="return-items-list"></div>
            </div>
        </div>
        <div class="mt-8 border-t pt-6">
            <button type="button" id="finalize-btn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-lg text-sm font-semibold text-white bg-green-600 hover:bg-green-700">Finalize & Print Return Slip</button>
        </div>
    </div>
    <div id="error-display" class="hidden max-w-3xl mx-auto text-center mt-4 text-red-600"></div>
    <div id="receipt-preview" class="print-container"></div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const returnForm = document.getElementById('return-form');
        const errorDisplay = document.getElementById('error-display');
        const returnItemsList = document.getElementById('return-items-list');
        const finalizeBtn = document.getElementById('finalize-btn');
        let originalData = {};

        try {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('data');
            if (!encodedData) throw new Error("No data found in URL. Please scan a valid requisition slip QR code.");

            originalData = JSON.parse(atob(encodedData));
            if (originalData.slipType !== "Requisition") throw new Error("Invalid QR code scanned. Please scan a Requisition Slip.");

            document.getElementById('boatName-display').textContent = originalData.boatName;
            document.getElementById('personName-display').textContent = originalData.personName;
            document.getElementById('date-display').textContent = new Date(originalData.date).toLocaleString();

            originalData.items.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'grid grid-cols-4 gap-4 items-center p-3 border rounded-md bg-gray-50';
                row.innerHTML = `
                    <div class="col-span-2">
                        <div class="font-medium text-sm text-gray-800">${item.partNo || '(No P/N)'}</div>
                        <div class="text-xs text-gray-500">${item.desc || ''}</div>
                    </div>
                    <div class="text-center">
                        <div class="text-xs text-gray-500">Taken</div>
                        <div class="font-bold text-lg text-blue-600">${item.qty}</div>
                    </div>
                    <div class="text-center">
                        <label for="return-qty-${index}" class="text-xs text-gray-500 block">Returned</label>
                        <input type="number" id="return-qty-${index}" class="return-qty-input mt-1 w-20 text-center px-2 py-1 border border-gray-300 rounded-md text-sm" value="0" min="0" max="${item.qty}">
                    </div>`;
                returnItemsList.appendChild(row);
            });

        } catch (e) {
            returnForm.classList.add('hidden');
            errorDisplay.textContent = e.message;
            errorDisplay.classList.remove('hidden');
        }

        finalizeBtn.addEventListener('click', () => {
            const finalItems = [];
            originalData.items.forEach((item, index) => {
                const qtyTaken = parseInt(item.qty, 10);
                const qtyReturnedInput = document.getElementById(`return-qty-${index}`);
                const qtyReturned = parseInt(qtyReturnedInput.value, 10);

                if (qtyReturned > qtyTaken) {
                    qtyReturnedInput.style.borderColor = 'red';
                    alert(`Cannot return more items than were taken for "${item.partNo}".`);
                    throw new Error("Invalid return quantity.");
                }
                qtyReturnedInput.style.borderColor = '';

                finalItems.push({
                    ...item,
                    qtyReturned: qtyReturned,
                    qtyUsed: qtyTaken - qtyReturned
                });
            });

            const finalData = { ...originalData, slipType: 'Reconciliation', items: finalItems, finalizedDate: new Date().toISOString() };
            const dateFinalizedString = new Date(finalData.finalizedDate).toLocaleDateString('en-PH', { year: 'numeric', month: '2-digit', day: '2-digit' });
            
            let itemsHtml = '';
            finalItems.forEach(item => {
                itemsHtml += `<div class="item-row"><div class="col-part">${item.partNo || item.desc}</div><div class="col-qty">${item.qty}</div><div class="col-qty">${item.qtyReturned}</div><div class="col-qty">${item.qtyUsed}</div></div>`;
            });
            
            document.getElementById('receipt-preview').innerHTML = `
                <div class="receipt-content">
                    <header><h1>AGC MARINE SOLUTIONS</h1><h2>Stock Reconciliation Slip</h2></header>
                    <section class="info-section">
                        <div><strong>For:</strong> ${originalData.boatName}</div>
                        <div><strong>By:</strong> ${originalData.personName}</div>
                        <div><strong>Finalized:</strong> ${dateFinalizedString}</div>
                    </section>
                    <section class="items-table">
                        <div class="items-header"><div class="row"><div class="col-part">PART</div><div class="col-qty">TAKEN</div><div class="col-qty">RTN'D</div><div class="col-qty">USED</div></div></div>
                        <div class="items-body">${itemsHtml}</div>
                    </section>
                    <footer><div id="qrcode-container" class="qrcode-container"></div></footer>
                </div>`;

            new QRCode(document.getElementById("qrcode-container"), { text: JSON.stringify(finalData), width: 90, height: 90, correctLevel: QRCode.CorrectLevel.M });
            setTimeout(() => window.print(), 250);
        });
    });
    </script>
</body>
</html>
